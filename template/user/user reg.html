{% extends 'head.html' %}
{% block content %}



    <section class="course-selection">
        <div class="dotts py-lg-5 py-3">
            <div class="container">
                <div class="row justify-content-between align-items-center">
                    <div  class="col-lg-12 course-right">
                        <h3 class="course">
                           
                            <br>
                        </h3>
                      <form action="/user_reg/" method="POST">
					{% csrf_token %}
					<div class="col-md-6 form-line">
			  			<div class="form-group">
			  				<label>Name</label>
					    	<input type="text" class="form-control" id="" placeholder=" Enter Name" name="name">
				  		</div>
				  		
				  		<div class="form-group">
					    	<label>Email</label>
					    	<input type="email" class="form-control" id="" placeholder=" Enter Email id" name="email">
					  	</div>	
					  	<div class="form-group">
					    	<label>Password</label>
					    	<input type="password" class="form-control" id="" placeholder=" Enter password" name="password">
					  	</div>
					  	<div class="form-group">
					    	<label>Contact</label>
					    	<input type="tel" class="form-control" id="" placeholder=" Enter 10-digit mobile no." name="contact">
			  			</div>
			  		</div>
			  		<div class="col-md-6">
			  			<div class="form-group">
			  				<label> Address</label>
			  			 	<textarea  class="form-control" id="" placeholder="Enter Your Address" name="address"></textarea>
			  			</div>
			  			
			  		</div>
				<div class="col-md-6">
			  			<div class="form-group">
                            <input class="form-control mt-3" type="submit" value="submit">
                     </div></div>
                 
                </form>
            </div>
        </div>
    </div>
</div>
</section>


		

	{% endblock %}
