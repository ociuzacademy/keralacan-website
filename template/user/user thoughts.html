<body>

    <section class="course-selection">

            <form action="/user_story/" method="POST" enctype = "multipart/form-data">
                {% csrf_token %}

                {% for x in yy %}

               <div class="row">

                        {% endfor %}
                       
                        <div class="form-group">

                        <br>

                        
                       <div>

                    </div>
                   
                    </div>
                </form>
                </div>
        
    </section>
</body>
