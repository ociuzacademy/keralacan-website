{% extends 'patient/headfoot.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="zxx">

<head>
    <title>web</title>
<!-- <style>
    h2{
        color:white;
    }
</style> -->
<style>

.headind_srch{ padding:10px 29px 10px 20px; overflow:hidden; border-bottom:1px solid #c4c4c4;}

.recent_heading h4 {
  color: #05728f;
  font-size: 21px;
  margin: auto;
}
.srch_bar input{ border:1px solid #ffffff; border-width:0 0 1px 0; width:80%; padding:2px 0 4px 6px; background:none;}
.srch_bar .input-group-addon button {
  background: rgba(0, 0, 0, 0) none repeat scroll 0 0;
  border: medium none;
  padding: 0;
  color: #ffffff;
  font-size: 18px;
}
.srch_bar .input-group-addon { margin: 0 0 0 -27px;}

.chat_ib h5{ font-size:15px; color:#ffffff; margin:0 0 8px 0;}
.chat_ib h5 span{ font-size:13px; float:right;}
.chat_ib p{ font-size:14px; color:#989898; margin:auto}
.chat_img {
  float: left;
  width: 11%;
}
.chat_ib {
  float: left;
  padding: 0 0 0 15px;
  width: 88%;
}

.chat_people{ overflow:hidden; clear:both;}
.chat_list {
  border-bottom: 1px solid #c4c4c4;
  margin: 0;
  padding: 18px 16px 10px;
}
.inbox_chat { height: 550px; overflow-y: scroll;}

.active_chat{ background:#ebebeb;}

.incoming_msg_img {
  display: inline-block;
  width: 6%;
}
.received_msg {
  display: inline-block;
  padding: 0 0 0 10px;
  vertical-align: top;
  width: 92%;
 }
 .received_withd_msg p {
  background: #ebebeb none repeat scroll 0 0;
  border-radius: 3px;
  color: #646464;
  font-size: 14px;
  margin: 0;
  padding: 5px 10px 5px 12px;
  width: 100%;
}
.time_date {
  color: #ffffff;
  display: block;
  font-size: 12px;
  margin: 8px 0 0;
}
.received_withd_msg { width: 57%;}
.mesgs {
  float: left;
  padding: 30px 15px 0 25px;
  width: 60%;
}

 .sent_msg p {
  background: #05728f none repeat scroll 0 0;
  border-radius: 3px;
  font-size: 14px;
  margin: 0; color:#fff;
  padding: 5px 10px 5px 12px;
  width:100%;
}
.outgoing_msg{ overflow:hidden; margin:26px 0 26px;}
.sent_msg {
  float: right;
  width: 46%;
}
.input_msg_write input {
  /*background: rgba(0, 0, 0, 0) none repeat scroll 0 0;*/
  border: medium none;
  color: #ffffff;
  font-size: 15px;
  min-height: 48px;
  width: 100%;
  background: black;
}

.type_msg {border-top: 1px solid #ffffff;position: relative;}
.msg_send_btn {
  background: #05728f none repeat scroll 0 0;
  border: medium none;
  border-radius: 60%;
  color: #fff;
  cursor: pointer;
  font-size: 17px;
  height: 50px;
  position: absolute;
  right: 0;
  left: 10;
  top: 40px;

  width: 40px;
}
.messaging { padding: 0 0 50px 0;}
.msg_history {
  height: 516px;
  overflow-y: auto;
}  
</style>
</head>
<body>
  <section class="course-selection">
        
                <section>
<div class="container">
    <div class="row">
        <div class="col-md-12">
        <div class="mesgs">
          <div class="msg_history">
                {% for x in hh %}
<div class="outgoing_msg">
              <div class="sent_msg">
                
                  <p>{{x.msg}}
                    </p>
                    
                <span class="time_date"> {{x.time}}   |    {{x.date}}</span> </div>
            </div> 
            <div class="incoming_msg">
              <div class="incoming_msg_img"> <img src="https://ptetutorials.com/images/user-profile.png" alt="sunil"> </div>

              <div class="received_msg">
                <div class="received_withd_msg">
                    
                  <p>{{x.replay}}
                    </p>    

                  <span class="time_date"> {{x.time}}   |    {{x.date}}</span></div>
              </div>
            </div>
                       
          {% endfor %}
            
          </div>
         <div class="type_msg">
            <div class="container"><br>
            <form action="/patient_chat/" method="POST">
                {% csrf_token %}
                
               <div class="row">
                    <div class="col-md-6">

                        <div class="form-group">
                             
                        {% for x in zz %}
                            <input type="hidden" class="write_msg" name="doctorname" value="{{x.doctor_id.name}}">
                                {% endfor %}

                            <!-- <select class="form-control option" name="doctorname">
                                <option>Select doctor</option>

                                {% for x in zz %}

                                <option value="{{x.id}}">{{x.name}}</option>

                                {% endfor %}
                            </select> -->
                        </div>
            <!--             <div class="input_msg_write">
              <input type="text"  name="msg" class="write_msg" placeholder="Type a message" />
               <button class="msg_send_btn" type="Submit"><i class="fa fa-paper-plane-o" aria-hidden="true"></i>send</button> -->
              <!-- <input  class="msg_send_btn" type="Submit" value="post"/><i class="fa fa-paper-plane-o" aria-hidden="true"></i>  -->
              <!-- <button class="msg_send_btn" type="button"><i class="fa fa-paper-plane-o" aria-hidden="true"></i>send</button> -->
            <!-- </div> -->
                        <!-- <div class="form-group">
                            <textarea name="msg" class="form-control" placeholder="type message" style="width: 100%; height: 150px;"></textarea>
                        </div>

                        <br>
                       <div>
                            <input type="Submit" value="post"/> 
                        </div> -->
                    </div>
                   
                    </div>
                
            <div class="input_msg_write">
               
              <input type="text" name="msg" class="write_msg" placeholder="Type a message" />
              <button class="msg_send_btn" type="Submit">send</button><i class="fa fa-paper-plane-o" aria-hidden="true"></i>
            </div>
            </form>
                </div>
          </div>
        </div>
      </div>
  </div>
</div>
    
</section>
        
    </section>
</body>
</html>
{% endblock %}
