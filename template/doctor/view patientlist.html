{% extends 'doctor/dochead.html' %}
{% block content %}


<section class="w3l-clients py-5" id="clients">
    <div class="call-w3 py-lg-5 py-md-4">
        <div class="container">
   <style type="text/css">
		#customers {
		  font-family: Arial, Helvetica, sans-serif;
		  border-collapse: collapse;
		  width: 80%;
		  margin-left: auto;
    	  margin-right: auto;
    	  margin-bottom: 100px;
    	  margin-top: 	auto;
    	  border: 10px;
		}

		#customers td, #customers th {
		  border: 1px solid #ddd;
		  padding: 8px;
		}

		#customers tr:nth-child(even){background-color: #ddd; color: black;}

		#customers tr:nth-child(odd) {background-color: #ddd; color: black;}

		#customers th {
		  padding-top: 12px;
		  padding-bottom: 12px;
		  text-align: left;
		  background-color: #4CAF50;
		  color: white;
		}

	</style>


	<table id="customers" cellpadding="0" cellspacing="0" border="10">
		<thead>		
		<tr>
    		<th>Patient Name</th>
		<th> Email</th>
		<th> Address</th>
		<th> Contact</th>
		<th colspan="2"></th>

                </tr>
                </thead>
                <tbody>

	{% for x in db %}

	<tr>

		<td>{{x.patient_id.name}}</td>
		<td>{{x.patient_id.email}}</td>
		<td>{{x.patient_id.address}}</td>
		<td>{{x.patient_id.contact}}</td>
		<td><a href="/doc_chat/?id={{x.id}}"><button> Open</a></button></td>
	</tr>

		{% endfor %}
            </tbody>
	

	</table>
</div></div></section>


{% endblock %}
