{% extends 'head.html' %}
{% block content %}



    <section class="course-selection">
        <div class="dotts py-lg-5 py-3">
            <div class="container">
                <div class="row justify-content-between align-items-center">
                    <div  class="col-lg-12 course-right">
                        <h3 class="course">
                          
                        </h3>
 <form action="/sponser_reg/" method="POST">
					{% csrf_token %}
					<div class="col-md-6 form-line">
			  			<div class="form-group">
			  				<label>Name</label>
					    	<input type="text" class="form-control" id="" placeholder=" Enter Name" name="name" required="">
				  		</div>
				  		<div class="form-group">
			  				<label>DOB</label>
					    	<input type="date" class="form-control" id="" placeholder=" Enter dob" name="dob" required="">
				  		</div>
				  		
				  		<div class="form-group">
					    	<label>Email</label>
					    	<input type="email" class="form-control" id="" placeholder=" Enter Email id" name="email" required="">
					  	</div>	
					  	<div class="form-group">
					    	<label>Password</label>
					    	<input type="password" class="form-control" id="" placeholder=" Enter password" name="password" required="">
					  	</div>
					  	<div class="form-group">
					    	<label>Contact</label>
					    	<input type="tel" class="form-control" id="" placeholder=" Enter 10-digit mobile no." name="contact" required="">
			  			</div>
			  		</div>
			  		<div class="col-md-6">
			  			<div class="form-group">
			  				<label> Address</label>
			  			 	<textarea required="" class="form-control" id="" placeholder="Enter Your Address" name="address"></textarea>
			  			</div>
			  			<div class="form-group">
			  				<label>gender</label><br>
			  				<input type="radio" name="gender" value="male" /> Male <br>  
							<input type="radio" name="gender" value="female"/> Female <br>  
							<input type="radio" name="gender" value="other"/> Other  
							<br>
					    	
				  		</div>
			  			<div>

			  
                            <input class="form-control mt-3" type="submit" value="submit">
                        </div></div>                        </form>
                    </div>
                    <div class="col-lg-6 course-right">
</section>
    {% if error %}
<script type="text/javascript">
  swal("Error!", "{{error}}", "error");
</script>
{% endif %}

{% if success %}
<script type="text/javascript">
  swal("Congrats!", "{{success}}", "success");
</script>
{% endif %}

{% if info %}
<script type="text/javascript">
  swal("Information!", "{{info}}", "info");
</script>
{% endif %}		

	{% endblock %}
