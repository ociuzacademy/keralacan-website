{% extends 'admin/head foot.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="zxx">

<head>
    <title>web</title>
    <style>
	h2{
		color:white;
	}
</style>

</head>
<body>
	<section class="course-selection">
		<div class="container"><br>
			 <div class="col-lg-12 course-right">
				<h2>Add Doctor</h2><br>
				<form action="/doc_reg/" method="POST">
					{% csrf_token %}
					<div class="row">
                    <div class="col-md-6">
			  			<div class="form-group">
			  				<label>Name</label>
					    	<input type="text" class="form-control" id="" placeholder=" Enter Name" name="name" required="">
				  		</div>
				  		
				  		<div class="form-group">
					    	<label>Email</label>
					    	<input type="email" class="form-control" id="" placeholder=" Enter Email id" name="email" required="">
					  	</div>	
					  	<div class="form-group">
					    	<label>Password</label>
					    	<input type="password" class="form-control" id="" placeholder=" Enter password" name="password" required="">
					  	</div>
					  	<div class="form-group">
					    	<label>Contact</label>
					    	<input type="tel" class="form-control" id="" placeholder=" Enter 10-digit mobile no." name="contact" required="" maxlength="10">
			  			</div>
			  		
			  		
			  			<div class="form-group">
			  				<label> Address</label>
			  			 	<textarea required="" class="form-control" id="" placeholder="Enter Your Address" name="address"></textarea>
			  			</div>
			  			 <select class="form-control option" name="spc">
                                <option >Select specialisation</option>
                                <option value="Pediatric Oncologist">Pediatric Oncologist</option>
                                <option value="Neuro-Oncologist">Neuro-Oncologist</option>
                                <option value="Hematologist-Oncologist">Hematologist-Oncologist</option>
                                <option value="Radiation Oncologist">Radiation Oncologist</option>
                                <option value="Surgical Oncologist">Surgical Oncologist</option>
                                <option value="Gynecologic Oncologist">Gynecologic Oncologist</option>
                            </select>
			  			<br>
			  			<div>

			  				<input class="form-control mt-3" type="Submit" value="Submit"/>
			  			</div>
			  			
					
				</div>
			</div>
				</form>
			</div></div>

	</body>
	</html>
	<br>
	{% endblock %}
